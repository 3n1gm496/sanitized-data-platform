[project]
name = "sanitized-data-platform"
version = "0.1.0"
description = "Technology-agnostic scaffolding for a sanitized data delivery platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "uvicorn>=0.42,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
